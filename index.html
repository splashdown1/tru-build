<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14120e">
<title>TRU BUILD</title>
<style>
:root{--bg:#14120e;--ink:#f3ecdf;--dim:#b7aa94;--line:#3a3226;--wood:#e0b56a;--card:#221c14}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif}
button,input{font:inherit;color:inherit}
header{padding:16px 16px 6px} h1{font-size:22px;letter-spacing:.14em;margin:0;font-weight:normal} h1 span{color:var(--wood)}
.sub{color:var(--dim);font-size:13px}
.bar{display:flex;gap:8px;padding:8px 16px} input{flex:1;background:#100e0a;border:1px solid var(--line);border-radius:8px;padding:10px}
button{background:var(--wood);color:#1a140c;border:0;border-radius:8px;padding:10px 12px;font-weight:bold}
main{padding:0 16px 28px} .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.k{color:var(--wood);font-size:12px;letter-spacing:.12em} .big{font-size:22px;margin:4px 0} .src{color:var(--dim);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header><h1>TRU <span>BUILD</span></h1><p class="sub">Order of work. Not a span table. Not a permit.</p></header>
<div class="bar"><input id="q" placeholder="order, square, shelter…" enterkeyhint="search"><button id="send">Send</button></div>
<main id="out"></main>
<script>
const C=[
{t:"Order",d:"Ground, then frame, then skin, then water, then heat. A roof before a floor keeps the work dry. A floor before a stove keeps the heat. Do not hang a load on a wall that is not tied down."},
{t:"Square",d:"Measure the two diagonals of a rectangle. Equal diagonals means the corners are square enough to build on. A 3-4-5 triangle does the same: 3 units, 4 units, the hypotenuse is 5 if the corner is square."},
{t:"Shelter",d:"A ridge needs two walls or two posts that are braced. A brace runs diagonal. A rectangle with no diagonal folds. Cord holds a lash. TRU Cord has the knots. This card does not size the timber."},
{t:"Water off the work",d:"Pitch a roof so water leaves. Overlap the skin the way shingles overlap, upper over lower, so water runs off a joint instead of into it. A flat joint holds a puddle."},
{t:"Gap",d:"No packed joist span, no packed snow load, no packed footing depth. Those depend on the wood, the soil, and the code where you stand. Wire is TRU Wire. Drain is TRU Drain."}
];
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&","<":"<",">":">"}[c]));}
function card(x){return `<article class="card"><div class="k">BUILD</div><div class="big">${esc(x.t)}</div><div>${esc(x.d)}</div><div class="src">Geometry and order of work. 3-4-5 is the Pythagorean check. No structural table.</div></article>`;}
function show(l){document.getElementById("out").innerHTML=l.map(card).join("");}
function search(q){q=(q||"").trim().toLowerCase(); if(!q){show(C);return;} const h=C.filter(x=>(x.t+" "+x.d).toLowerCase().includes(q)); document.getElementById("out").innerHTML=h.length?h.map(card).join(""):`<article class="card"><div class="k">GAP</div><div class="big">Not packed</div><div>No invented span or footing.</div></article>`;}
document.getElementById("send").onclick=()=>search(document.getElementById("q").value);
document.getElementById("q").onkeydown=e=>{if(e.key==="Enter") search(e.target.value);};
show(C);
</script>
</body>
</html>
